name: Playwright Tests & Email Report

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      project:
        description: 'Target browser'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - chromium
          - firefox
          - edge
      tag:
        description: 'Tag to run'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - '@smoke'
          - '@regression'

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers and System Dependencies
        run: npx playwright install --with-deps
        env:
          DEBIAN_FRONTEND: noninteractive

      - name: Run Playwright Tests
        id: run_tests
        continue-on-error: true
        run: |
          PROJECT_ARG="${{ github.event.inputs.project != 'all' && github.event.inputs.project != '' && format('--project={0}', github.event.inputs.project) || '' }}"
          TAG_ARG="${{ github.event.inputs.tag != 'all' && github.event.inputs.tag != '' && format('--grep {0}', github.event.inputs.tag) || '' }}"
          npx playwright test $PROJECT_ARG $TAG_ARG
        env:
          HEADLESS: true
          URL: https://tutorialsninja.com/demo/

      - name: Upload Playwright Report Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Send Execution Email Notification
        uses: dawidd6/action-send-mail@v3
        if: always()
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "GitHub Actions: Playwright Tests ${{ steps.run_tests.outcome == 'success' && 'PASSED' || 'FAILED' }} (${{ github.repository }})"
          to: ${{ secrets.MAIL_TO }}
          from: "Playwright Automation CI <${{ secrets.MAIL_USERNAME }}>"
          html_body: |
            <!DOCTYPE html>
            <html>
            <body style="font-family: Arial, sans-serif; line-height: 1.6; color: #333;">
              <h2 style="color: ${{ steps.run_tests.outcome == 'success' && '#28a745' || '#dc3545' }};">
                Playwright Test Execution: ${{ steps.run_tests.outcome == 'success' && 'PASSED' || 'FAILED' }}
              </h2>
              <table style="border-collapse: collapse; width: 100%; max-width: 500px;">
                <tr><td style="padding: 8px; border: 1px solid #ddd; font-weight: bold;">Repository:</td><td style="padding: 8px; border: 1px solid #ddd;">${{ github.repository }}</td></tr>
                <tr><td style="padding: 8px; border: 1px solid #ddd; font-weight: bold;">Branch:</td><td style="padding: 8px; border: 1px solid #ddd;">${{ github.ref_name }}</td></tr>
                <tr><td style="padding: 8px; border: 1px solid #ddd; font-weight: bold;">Commit:</td><td style="padding: 8px; border: 1px solid #ddd;">${{ github.sha }}</td></tr>
                <tr><td style="padding: 8px; border: 1px solid #ddd; font-weight: bold;">Status:</td><td style="padding: 8px; border: 1px solid #ddd; font-weight: bold; color: ${{ steps.run_tests.outcome == 'success' && 'green' || 'red' }};">${{ steps.run_tests.outcome }}</td></tr>
              </table>
              <p style="margin-top: 20px;">
                <a href="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                   style="background-color: #0366d6; color: white; padding: 10px 18px; text-decoration: none; border-radius: 4px; display: inline-block;">
                  View Run Logs & Download HTML Report
                </a>
              </p>
            </body>
            </html>

      - name: Check Final Status
        if: steps.run_tests.outcome != 'success'
        run: exit 1
